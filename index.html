<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная Ёлочка 2027</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-year">2027</div>
    
    <div class="wrapper">
        <div class="scene">
            <svg class="tree-svg" viewBox="0 0 400 500">
                <polygon points="200,10 215,45 250,45 220,65 235,100 200,80 165,100 180,65 150,45 185,45" fill="#f1c40f" filter="drop-shadow(0 0 8px #f1c40f)"/>
                <rect x="180" y="440" width="40" height="60" fill="#5c4033" />
                <polygon points="200,70 120,180 280,180" fill="#2d5a27" />
                <polygon points="200,140 90,270 310,270" fill="#244d1f" />
                <polygon points="200,220 60,370 340,370" fill="#1b3b18" />
                <polygon points="200,300 30,450 370,450" fill="#132b11" />
            </svg>
            
            <!-- Интерактивная область для шаров и огоньков -->
            <div class="interactive-area" id="interactiveArea"></div>
            
            <!-- Секция HTML подарков -->
            <div class="gifts-section">
                <div class="gift g1" data-id="1" title="Нажмите, чтобы открыть подарок"></div>
                <div class="gift g2" data-id="2" title="Нажмите, чтобы открыть подарок"></div>
                <div class="gift g3" data-id="3" title="Нажмите, чтобы открыть подарок"></div>
            </div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-icon" id="modalIcon">🎄</div>
            <h3 class="modal-title" id="modalTitle">Заголовок</h3>
            <p class="modal-text" id="modalText">Текст сообщения...</p>
            <a href="#" target="_blank" class="modal-btn" id="modalBtn">Смотреть тренировку</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
